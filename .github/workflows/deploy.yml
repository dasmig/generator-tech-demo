name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The libraries are checked out at their release tags, so the site only
  # changes when a release does.
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout generator-tech-demo
        uses: actions/checkout@v4

      - name: Checkout name-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/name-generator
          ref: v4.5.0
          path: name-generator

      - name: Checkout nickname-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/nickname-generator
          ref: v5.2.0
          path: nickname-generator

      - name: Checkout entity-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/entity-generator
          ref: v4.2.1
          path: entity-generator

      - name: Checkout country-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/country-generator
          ref: v3.2.0
          path: country-generator

      - name: Checkout city-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/city-generator
          ref: v4.2.0
          path: city-generator

      - name: Checkout birth-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/birth-generator
          ref: v3.2.0
          path: birth-generator

      - name: Checkout biodata-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/biodata-generator
          ref: v5.0.0
          path: biodata-generator

      - name: Checkout interest-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/interest-generator
          ref: v3.0.1
          path: interest-generator

      - name: Checkout trait-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/trait-generator
          ref: v2.1.2
          path: trait-generator

      - name: Checkout occupation-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/occupation-generator
          ref: v3.0.1
          path: occupation-generator

      - name: Checkout persona-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/persona-generator
          ref: v4.1.0
          path: persona-generator

      - name: Checkout phone-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/phone-generator
          ref: v2.1.1
          path: phone-generator

      - name: Checkout email-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/email-generator
          ref: v2.1.1
          path: email-generator

      # The demo's data pack comes from the lite tier (scripts/make_web_pack.py).
      - name: Checkout address-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/address-generator
          ref: v2.1.0
          path: address-generator

      - name: Checkout user-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/user-generator
          ref: v2.0.0
          path: user-generator

      - name: Checkout relationship-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/relationship-generator
          ref: v1.2.0
          path: relationship-generator

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74 # the version the libraries' CI tests with

      - name: Configure
        run: >
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          -DNAME_GEN_DIR=${{ github.workspace }}/name-generator
          -DNICK_GEN_DIR=${{ github.workspace }}/nickname-generator
          -DENTITY_GEN_DIR=${{ github.workspace }}/entity-generator
          -DCOUNTRY_GEN_DIR=${{ github.workspace }}/country-generator
          -DCITY_GEN_DIR=${{ github.workspace }}/city-generator
          -DBIRTH_GEN_DIR=${{ github.workspace }}/birth-generator
          -DBIODATA_GEN_DIR=${{ github.workspace }}/biodata-generator
          -DINTEREST_GEN_DIR=${{ github.workspace }}/interest-generator
          -DTRAIT_GEN_DIR=${{ github.workspace }}/trait-generator
          -DOCCUPATION_GEN_DIR=${{ github.workspace }}/occupation-generator
          -DPHONE_GEN_DIR=${{ github.workspace }}/phone-generator
          -DEMAIL_GEN_DIR=${{ github.workspace }}/email-generator
          -DADDRESS_GEN_DIR=${{ github.workspace }}/address-generator
          -DUSER_GEN_DIR=${{ github.workspace }}/user-generator
          -DRELGEN_GEN_DIR=${{ github.workspace }}/relationship-generator
          -DPERSONA_GEN_DIR=${{ github.workspace }}/persona-generator

      - name: Build
        run: cmake --build build

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp build/*.js build/*.wasm _site/
          cp build/personagen_demo.data _site/
          (cd address-generator && python3 scripts/make_web_pack.py --out ../_site/address-pack)

      - name: Upload preview artifact
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: demo-preview
          path: _site

      - name: Setup Node.js for browser smoke test
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test all demos in Chrome
        run: node tests/traitgen_smoke.mjs _site .

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

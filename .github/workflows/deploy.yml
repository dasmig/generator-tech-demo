name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The libraries are checked out at their release tags, so the site only
  # changes when a release does.
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout generator-tech-demo
        uses: actions/checkout@v4

      - name: Checkout name-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/name-generator
          ref: v3.0.0
          path: name-generator

      - name: Checkout nickname-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/nickname-generator
          ref: v2.0.0
          path: nickname-generator

      - name: Checkout entity-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/entity-generator
          ref: v2.0.0
          path: entity-generator

      - name: Checkout country-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/country-generator
          ref: v2.0.0
          path: country-generator

      - name: Checkout city-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/city-generator
          ref: v2.0.0
          path: city-generator

      - name: Checkout birth-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/birth-generator
          ref: v2.0.0
          path: birth-generator

      - name: Checkout biodata-generator
        uses: actions/checkout@v4
        with:
          repository: dasmig/biodata-generator
          ref: v2.0.0
          path: biodata-generator

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74 # the version the libraries' CI tests with

      - name: Configure
        run: >
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          -DNAME_GEN_DIR=${{ github.workspace }}/name-generator
          -DNICK_GEN_DIR=${{ github.workspace }}/nickname-generator
          -DENTITY_GEN_DIR=${{ github.workspace }}/entity-generator
          -DCOUNTRY_GEN_DIR=${{ github.workspace }}/country-generator
          -DCITY_GEN_DIR=${{ github.workspace }}/city-generator
          -DBIRTH_GEN_DIR=${{ github.workspace }}/birth-generator
          -DBIODATA_GEN_DIR=${{ github.workspace }}/biodata-generator

      - name: Build
        run: cmake --build build

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp build/*.js build/*.wasm _site/
          cp build/*.data _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
